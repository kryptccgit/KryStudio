links = "kss_signalsmith_stretch"

[lib]
doctest = false

[dependencies]

[build-dependencies]
cc = "1"                    # MIT OR Apache-2.0 (C++ build of the vendored headers)

[dev-dependencies]
rustfft = "6.2"             # MIT OR Apache-2.0 (pitch tests)
