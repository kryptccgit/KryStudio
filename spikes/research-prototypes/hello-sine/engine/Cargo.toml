[package]
name = "krypt-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
cpal = { version = "0.18.2", features = ["realtime"] } # Apache-2.0; realtime pulls audio_thread_priority (MPL-2.0)
serde = { version = "1", features = ["derive"] }      # MIT OR Apache-2.0
serde_json = "1"                                       # MIT OR Apache-2.0

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"          # a panic kills the sidecar; Electron main restarts it
debug = "line-tables-only"
